# Model arguments
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
model_revision: main
torch_dtype: float32
attn_implementation: eager

# Data training arguments
dataset_name: c:/Users/MSI/Desktop/ARENA/data/data_train/grpo/grpo_500.jsonl

# GRPO trainer config
bf16: false
fp16: false
use_vllm: false
do_eval: false
eval_strategy: "no"
gradient_accumulation_steps: 2
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
hub_model_id: None
hub_strategy: every_save
learning_rate: 3.0e-06
log_completions: true
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
lr_scheduler_type: cosine
max_steps: 1000 # Increased from 10 to 1000
num_generations: 2
output_dir: c:/Users/MSI/Desktop/ARENA/checkpoints/grpo_New
per_device_train_batch_size: 2
save_strategy: steps
save_steps: 5
save_total_limit: 1
seed: 42
warmup_steps: 2
weight_decay: 0.01
report_to: []
